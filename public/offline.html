<!doctype html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechMood — لا اتصال</title>
<style>

  h1 { font-size: 1.2rem; margin: 16px 0 8px; }
  p { font-size: 0.92rem; opacity: 0.8; line-height: 1.7; }

<body>
<main>
  <img src="/logo-mark.png" alt="TechMood">

  <button onclick="location.reload()">أعد المحاولة</button>

</html>
